name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-installer
      - feature/offline-sync

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test all offline Electron modules
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path "electron/test" -Filter "*.test.cjs" -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw "No Electron offline tests found" }
          & node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify exported desktop pages and installer
        shell: pwsh
        run: |
          $required = @(
            "out/index.html",
            "out/login/index.html",
            "out/atlar/index.html",
            "release/Atcylyk-Portal-Setup-1.0.0.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing desktop build artifact: $file"
            }
          }
          $installer = Get-Item -LiteralPath "release/Atcylyk-Portal-Setup-1.0.0.exe"
          if ($installer.Length -le 0) { throw "Installer is empty" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Atcylyk-Portal-Setup-1.0.0
          path: release/Atcylyk-Portal-Setup-1.0.0.exe
          if-no-files-found: error

