name: Reconcile recovery lockfile
on:
  push:
    branches: [integration/v1.1.0-offline-rebased]
    paths:
      - '.github/workflows/reconcile-recovery-lockfile.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate dependency lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible dependency resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only package-lock.json to this isolated integration branch
        shell: bash
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize Electron dependency lockfile"
          git push origin HEAD:refs/heads/integration/v1.1.0-offline-rebased
