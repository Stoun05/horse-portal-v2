name: Offline store tests
on:
  push:
    branches: [feature/offline-sync]
  pull_request:
    paths:
      - 'electron/**'
      - 'electron/test/**'
      - '.github/workflows/offline-store-tests.yml'
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test electron/test/*.test.cjs
