name: Offline store tests
on:
  push:
    branches: [feature/offline-sync]
  pull_request:
    paths:
      - 'electron/**'
      - 'electron/test/**'
      - '.github/workflows/offline-store-tests.yml'
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test account-offline-store
        run: node --test electron/test/account-offline-store.test.cjs
      - name: Test authorized-offline-store
        run: node --test electron/test/authorized-offline-store.test.cjs
      - name: Test offline-access
        run: node --test electron/test/offline-access.test.cjs
      - name: Test offline-backup
        run: node --test electron/test/offline-backup.test.cjs
      - name: Test offline-ipc
        run: node --test electron/test/offline-ipc.test.cjs
      - name: Test offline-key-store
        run: node --test electron/test/offline-key-store.test.cjs
      - name: Test offline-store
        run: node --test electron/test/offline-store.test.cjs
      - name: Test offline-vault
        run: node --test electron/test/offline-vault.test.cjs
      - name: Test protected-offline-store
        run: node --test electron/test/protected-offline-store.test.cjs
      - name: Test sync-planner
        run: node --test electron/test/sync-planner.test.cjs
