name: Build Windows EXE
# Windows installer build for v1.1.0-beta.3

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static web and Windows installer
        run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Atcylyk-Portal-Windows-v1.1.0-beta.3
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.1.0-beta.3
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Atçylyk portaly $TAG" --notes-file RELEASE_NOTES_v1.1.0-beta.3.md --prerelease
          fi
          gh release upload "$TAG" dist/*.exe --clobber
