name: Local server tests
on:
  push:
    branches: [feature/local-server]
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/local-server-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
