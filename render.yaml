# Render Blueprint: public Next.js server with protected admin routes.
# This is a web service, NOT a static site. Never commit real passwords.
services:
  - type: web
    name: atcylyk-portal
    runtime: node
    plan: free
    repo: https://github.com/Stoun05/horse-portal-v2
    branch: main
    buildCommand: npm install --include=dev --package-lock=false --no-audit --no-fund && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p ${PORT:-10000}
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
